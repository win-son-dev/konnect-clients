name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        # Auth0Client warns if env vars are missing during build; CI provides
        # placeholders so logs stay clean. No real Auth0 calls happen at build time.
        env:
          AUTH0_DOMAIN: example.us.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client-id
          AUTH0_CLIENT_SECRET: ci-placeholder-client-secret-thirty-two-chars
          AUTH0_SECRET: ci-placeholder-secret-thirty-two-characters-long
          APP_BASE_URL: http://localhost:3000
        run: npm run build
